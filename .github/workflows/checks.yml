name: checks

# The offline suites: no network calls to any model, no Docker, no corpus.
# Each script exits non-zero on failure and prints one line per assertion.
# The corpus assertion in imports_resolve is skipped here by name
# (ERRATA_NO_CORPUS=1) and says so in its output; SWE-chat is gated data.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ERRATA_NO_CORPUS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # split_changes_nothing loads a revision of pipeline.py from history,
          # and the harness stamps rows with the commit it ran at.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install the locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps -e .

      - name: imports_resolve
        run: python checks/imports_resolve.py
      - name: front_stages_run
        run: python checks/front_stages_run.py
      - name: guards_hold
        run: python checks/guards_hold.py
      - name: split_changes_nothing
        run: python checks/split_changes_nothing.py
      - name: fixes_are_still_in
        run: python checks/fixes_are_still_in.py
      - name: crawl_holds
        run: python checks/crawl_holds.py
      - name: study_holds
        run: python checks/study_holds.py

      - name: The driver scripts parse
        run: bash -n scripts/*.sh

  harbor-side:
    # Harbor cannot share the locked environment (Harbor 0.23.0 needs openai
    # below 3), so it has its own, as a user's would; and the verifier runs in
    # the pinned Python image every task's image is built on. No model calls.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      ERRATA_DOTENV: "0"
      ERRATA_NO_CORPUS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: errata-bench's locked environment, and Harbor's
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-lock.txt
          .venv/bin/pip install -q --no-deps -e .
          python -m venv harbor-env
          harbor-env/bin/pip install -q harbor==0.23.0
          harbor-env/bin/pip install -q --no-deps -e .

      - name: harbor_agents
        env:
          ERRATA_REQUIRE_HARBOR: "1"
        run: harbor-env/bin/python checks/harbor_agents.py

      - name: verifier_in_container
        env:
          ERRATA_REQUIRE_DOCKER: "1"
        run: .venv/bin/python checks/verifier_in_container.py
